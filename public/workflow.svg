<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1660" viewBox="0 0 1440 1660" role="img" aria-labelledby="title description">
  <title id="title">The Smallest Agent: UML streaming workflow</title>
  <desc id="description">Five participant lifelines show prompt submission, validation, the TypeScript SDK and Claude exchange, repeated SSE progress messages, the final answer and done event, and error alternatives.</desc>
  <defs>
    <marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#285b98" />
    </marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#285b98" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1440" height="1660" fill="#f8fbff" />
  <text x="45" y="45" font-family="Arial, sans-serif" fill="#142547" font-size="28" font-weight="700">One prompt, from device to Claude and back</text>
  <text x="45" y="76" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">UML sequence diagram · POST stream mode · selected application-level interactions</text>
  <rect x="25" y="100" width="240" height="75" rx="12" fill="#edf5ff" stroke="#c3d4eb" />
  <text x="145" y="130" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="20" font-weight="700">Student / Device</text>
  <text x="145" y="157" text-anchor="middle" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">Prompt, answer, timeline</text>
  <line x1="145" y1="175" x2="145" y2="1580" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7" />
  <rect x="305" y="100" width="240" height="75" rx="12" fill="#f3edff" stroke="#c3d4eb" />
  <text x="425" y="130" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="20" font-weight="700">Kotlin Compose client</text>
  <text x="425" y="157" text-anchor="middle" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">State, prompt and timeline</text>
  <line x1="425" y1="175" x2="425" y2="1580" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7" />
  <rect x="585" y="100" width="240" height="75" rx="12" fill="#eaf7f0" stroke="#c3d4eb" />
  <text x="705" y="130" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="20" font-weight="700">Node API</text>
  <text x="705" y="157" text-anchor="middle" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">Route handler + SDK service</text>
  <line x1="705" y1="175" x2="705" y2="1580" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7" />
  <rect x="865" y="100" width="240" height="75" rx="12" fill="#fff2e6" stroke="#c3d4eb" />
  <text x="985" y="130" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="20" font-weight="700">TypeScript Agent SDK</text>
  <text x="985" y="157" text-anchor="middle" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">query() + CLI runtime</text>
  <line x1="985" y1="175" x2="985" y2="1580" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7" />
  <rect x="1145" y="100" width="240" height="75" rx="12" fill="#edf5ff" stroke="#c3d4eb" />
  <text x="1265" y="130" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="20" font-weight="700">Claude API</text>
  <text x="1265" y="157" text-anchor="middle" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">Model inference</text>
  <line x1="1265" y1="175" x2="1265" y2="1580" stroke="#9baec7" stroke-width="1.5" stroke-dasharray="7 7" />
  <line x1="145" y1="215" x2="425" y2="215" fill="none" stroke="#285b98" stroke-width="2" marker-end="url(#call)" />
  <text x="285.0" y="202" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">1. Run agent (prompt)</text>
  <line x1="425" y1="275" x2="705" y2="275" fill="none" stroke="#285b98" stroke-width="2" marker-end="url(#call)" />
  <text x="565.0" y="262" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">2. POST /api/agent/stream</text>
  <rect x="35" y="305" width="1370" height="1260" fill="none" stroke="#9baec7" stroke-width="1.5" />
  <text x="52" y="334" font-family="Arial, sans-serif" fill="#285b98" font-size="18" font-weight="700">alt [valid prompt and configured key]</text>
  <path d="M705 360 h95 v40 h-95" fill="none" stroke="#285b98" stroke-width="2" marker-end="url(#call)" />
  <text x="815" y="355" font-family="Arial, sans-serif" fill="#142547" font-size="18">3. Validate; tools disabled</text>
  <line x1="705" y1="460" x2="985" y2="460" fill="none" stroke="#285b98" stroke-width="2" marker-end="url(#call)" />
  <text x="845.0" y="447" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">4. streamAgent() / query()</text>
  <line x1="985" y1="525" x2="1265" y2="525" fill="none" stroke="#285b98" stroke-width="2" marker-end="url(#call)" />
  <text x="1125.0" y="512" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">5. Prompt; no built-in tools</text>
  <line x1="1265" y1="590" x2="985" y2="590" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="1125.0" y="577" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">6. Model response</text>
  <rect x="55" y="620" width="1330" height="285" rx="5" fill="#edf5ff" fill-opacity="0.8" stroke="#9baec7" />
  <text x="72" y="650" font-family="Arial, sans-serif" fill="#285b98" font-size="18" font-weight="700">loop [each intermediate SDK message]</text>
  <line x1="985" y1="710" x2="705" y2="710" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="845.0" y="697" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">7. Safe SDK message</text>
  <line x1="705" y1="785" x2="425" y2="785" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="565.0" y="772" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">8. SSE message event</text>
  <line x1="425" y1="865" x2="145" y2="865" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="285.0" y="852" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">9. Update typed state</text>
  <rect x="55" y="930" width="1330" height="490" fill="none" stroke="#9baec7" stroke-width="1.5" />
  <text x="72" y="960" font-family="Arial, sans-serif" fill="#285b98" font-size="18" font-weight="700">alt [final result received]</text>
  <line x1="985" y1="1015" x2="705" y2="1015" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="845.0" y="1002" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">10. ResultMessage fields</text>
  <line x1="705" y1="1080" x2="425" y2="1080" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="565.0" y="1067" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">11. SSE ResultMessage</text>
  <line x1="425" y1="1145" x2="145" y2="1145" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="285.0" y="1132" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">12. Render answer + metrics</text>
  <line x1="705" y1="1210" x2="425" y2="1210" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="565.0" y="1197" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">13. SSE done event</text>
  <line x1="55" y1="1240" x2="1385" y2="1240" stroke="#9baec7" stroke-dasharray="7 5" />
  <text x="72" y="1270" font-family="Arial, sans-serif" fill="#285b98" font-size="18" font-weight="700">else [SDK failure or missing final result]</text>
  <line x1="705" y1="1325" x2="425" y2="1325" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="565.0" y="1312" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">14. SSE error; no done</text>
  <line x1="425" y1="1390" x2="145" y2="1390" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="285.0" y="1377" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">15. Error + snackbar</text>
  <line x1="35" y1="1440" x2="1405" y2="1440" stroke="#9baec7" stroke-dasharray="7 5" />
  <text x="52" y="1470" font-family="Arial, sans-serif" fill="#285b98" font-size="18" font-weight="700">else [missing key or invalid prompt: SDK is not called]</text>
  <line x1="705" y1="1530" x2="425" y2="1530" fill="none" stroke="#285b98" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#return)" />
  <text x="565.0" y="1517" text-anchor="middle" font-family="Arial, sans-serif" fill="#142547" font-size="18">16. Key: SSE error / input: 422</text>
  <text x="45" y="1610" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">SDK lifecycle messages may arrive while inference is running; the diagram summarizes the application-level flow.</text>
  <text x="45" y="1640" font-family="Arial, sans-serif" fill="#4c6283" font-size="17">An error ResultMessage also shows failure in the UI. A done event closes the stream; it does not override is_error.</text>
</svg>
